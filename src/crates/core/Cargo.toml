[package]
name = "bitfun-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Sparo OS Core Library - Platform-agnostic business logic"

[lib]
name = "bitfun_core"
crate-type = ["rlib"]

[dependencies]
# Inherit shared dependencies from workspace
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
semver = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

log = { workspace = true }

uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
cron = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
md5 = { workspace = true }
aes = "0.8"
hex = "0.4"
dashmap = { workspace = true }
indexmap = { workspace = true }
arc-swap = { workspace = true }

reqwest = { workspace = true }

# Debug Log HTTP Server
axum = { workspace = true }
tower-http = { workspace = true }

glob = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
filetime = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
include_dir = { workspace = true }

# Command detection (cross-platform)
which = { workspace = true }
similar = { workspace = true }
urlencoding = { workspace = true }

grep-searcher = { workspace = true }
grep-regex = { workspace = true }
globset = { workspace = true }

# MCP Streamable HTTP client (official rust-sdk used by Codex)
rmcp = { version = "0.12.0", default-features = false, features = [
    "auth",
    "base64",
    "client",
    "macros",
    "schemars",
    "server",
    "transport-streamable-http-client-reqwest",
] }
sse-stream = "0.2.1"

# Shared AI protocol adapters
bitfun-ai-adapters = { path = "../ai-adapters" }
cli-credential = { path = "../libs/cli-credential" }

# Tool runtime
tool-runtime = { path = "src/agentic/tools/implementations/tool-runtime" }

# agentshell - agent-first terminal library
agentshell = { workspace = true }

# I18n internationalization
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }

# Encryption (Remote Connect E2E)
x25519-dalek = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

# Device/Network info (Remote Connect)
mac_address = { workspace = true }
local-ip-address = { workspace = true }
hostname = { workspace = true }

# QR code generation
qrcode = { workspace = true }

# Remote Connect relay WebSocket client
tokio-tungstenite = { workspace = true }

# Relay server shared library (embedded relay reuses standalone relay logic)
bitfun-relay-server = { path = "../../apps/relay-server" }

# Event layer dependency (lowest layer)
bitfun-events = { path = "../events" }

# Transport layer dependency
bitfun-transport = { path = "../transport" }

# Tauri dependency (optional, enabled only when needed)
tauri = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
win32job = { workspace = true }
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
schannel = "0.1"

[features]
default = []
tauri-support = ["tauri"]  # Optional tauri support

[[example]]
name = "recompile_product_app_runtime_host"
path = "examples/recompile_product_app_runtime_host.rs"
