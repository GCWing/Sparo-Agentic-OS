<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Sparo OS — Ignite AI for Everyone" />
  <meta name="apple-mobile-web-app-title" content="Sparo OS" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <title>Sparo OS</title>
  <script>
    (function() {
      var t = 'dark';
      try { var s = localStorage.getItem('bitfun-mobile-theme'); if (s === 'dark' || s === 'light') t = s; }
      catch(e) { if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light'; }
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', 'Geist', 'Noto Sans SC', 'HarmonyOS Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    html[data-theme="dark"] body  { background-color: #0F172A; color: rgba(248, 250, 252, 0.92); }
    html[data-theme="light"] body { background-color: #F8FAFC; color: #0F172A; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
