        var s = localStorage.getItem('sparo-mobile-theme');

      }

    body { font-family: 'Inter', 'Geist', 'Noto Sans SC', 'HarmonyOS Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    html[data-theme="light"] body { background-color: #F8FAFC; color: #0F172A; }

    /* Instant boot layer: no external images — avoids visible PNG decode/fetch before React */
    #boot-splash {

      inset: 0;

      display: flex;
      align-items: center;

    html[data-theme="light"] #boot-splash { background-color: #F8FAFC; color: #0F172A; }

    .boot-splash__loader {

      align-items: center;

    }

      stroke-width: 1.35;

    html[data-theme="light"] .boot-splash__ring { opacity: 0.18; }

    .boot-splash__accent {
      fill: #e11d48;
    }

    .boot-splash__orbit {
      transform-origin: 50px 50px;
      animation: boot-orbit-spin 1.15s linear infinite;
    }

    .boot-splash__core {
      animation: boot-core-pulse 1.6s ease-in-out infinite;
    }

    .boot-splash__wordmark {

      font-weight: 600;
      letter-spacing: 0.38em;

    @keyframes boot-fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes boot-orbit-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes boot-core-pulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-splash__loader { animation: none; }
      .boot-splash__orbit { animation: none; }
      .boot-splash__core { animation: none; }
    }
