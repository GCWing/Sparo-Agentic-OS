<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <!--
      Preload the splash wordmarks so the selected theme variant is visible at the same
      time as the first paint, instead of arriving a frame later as a blank
      <img>. Loaded with `fetchpriority=high` because the splash is the very
      first thing the user looks at.
    -->
    <link rel="preload" as="image" href="/brand/sparo-mark-256.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/sparo-wordmark-primary.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/sparo-wordmark-reversed.png" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Sparo OS</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var isAgentCompanionWindow = params.get('sparoWindow') === 'agent-companion';
        if (isAgentCompanionWindow) {
          var companionRoot = document.documentElement;
          companionRoot.dataset.sparoWindow = 'agent-companion';
          companionRoot.style.backgroundColor = 'transparent';
          function paintTransparentBody() {
            if (document.body) document.body.style.backgroundColor = 'transparent';
          }
          paintTransparentBody();
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', paintTransparentBody);
          } else {
            paintTransparentBody();
          }
          return;
        }

        /*
         * Theme bootstrap: the desktop shell injects an authoritative startup
         * theme before this page runs. ThemeService also mirrors the active
         * theme's primary background + id + type to localStorage on every apply. Reading it
         * here — before paint, before React, before the Tauri config
         * round-trip — lets the splash and window chrome render in the
         * user's actual theme from frame zero, instead of flashing a
         * generic dark/light fallback. Falls back to `prefers-color-scheme`
         * on first launch (no cache) or storage errors.
         */
        var dark = '#121214';
        /* Keep in sync with presets/light-theme.ts colors.background.primary */
        var light = '#F8FAFC';
        var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        var bg = m && m.matches ? dark : light;
        var themeId = null;
        var themeType = m && m.matches ? 'dark' : 'light';
        try {
          var injected = window.__SPARO_STARTUP_THEME__;
          var cached = injected || window.localStorage.getItem('sparo:theme-bootstrap');
          if (cached) {
            var parsed = typeof cached === 'string' ? JSON.parse(cached) : cached;
            if (parsed && typeof parsed.bg === 'string') bg = parsed.bg;
            if (parsed && typeof parsed.id === 'string') themeId = parsed.id;
            if (parsed && typeof parsed.type === 'string') themeType = parsed.type;
          }
        } catch (_) { /* corrupted cache — fall back to OS scheme */ }
        var root = document.documentElement;
        root.style.backgroundColor = bg;
        if (themeId) root.setAttribute('data-theme', themeId);
        if (themeType) root.setAttribute('data-theme-type', themeType);
        /* Expose for the static CSS fallback below (used inside the splash). */
        root.style.setProperty('--color-bg-primary', bg);
        function paintBody() {
          if (document.body) document.body.style.backgroundColor = bg;
        }
        paintBody();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', paintBody);
        } else {
          paintBody();
        }
      })();
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      /* Fallback before inline script runs; align with dark / light theme primaries */
      html {
        background-color: #121214;
      }
      @media (prefers-color-scheme: light) {
        html {
          background-color: #f3f3f5;
        }
      }
      
      body {
        background-color: inherit;
      }

      html[data-sparo-window='agent-companion'],
      html[data-sparo-window='agent-companion'] body,
      html[data-sparo-window='agent-companion'] #root {
        background: transparent !important;
      }

      /*
       * Splash: shown the instant the HTML reaches the webview, so the user
       * never stares at an empty colored rectangle while Vite walks the
       * import graph (dev) or the bundle parses (prod). The critical-path mark
       * is static HTML/CSS so React and the design-system bundle cannot block
       * its frames. It mirrors the reusable logo motion's approved timing.
       *
       * The startup entry paints and reveals this surface first, then loads
       * main.tsx. The main app removes the splash once the backend reports
       * `workspaceReady` (or `degraded`).
       *
       * Hidden on the agent-companion window — that window is intentionally
       * transparent and renders a custom pet widget.
       */
      #sparo-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: inherit;
        z-index: 2147483647;
        opacity: 1;
        transition: opacity 360ms ease;
        pointer-events: none;
      }
      #sparo-splash[data-leaving="1"] {
        opacity: 0;
      }
      html[data-sparo-window='agent-companion'] #sparo-splash {
        display: none;
      }

      .sparo-splash-titlebar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 40px;
        display: none;
        align-items: center;
        justify-content: flex-end;
        padding: 6px 10px;
        z-index: 1;
        pointer-events: auto;
        -webkit-app-region: drag;
      }

      html[data-sparo-static-window-controls='1'] .sparo-splash-titlebar {
        display: flex;
      }

      .sparo-splash-window-controls {
        display: flex;
        align-items: center;
        gap: 2px;
        -webkit-app-region: no-drag;
      }

      .sparo-splash-window-control {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        color: rgba(148, 163, 184, 0.92);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      html[data-theme-type='light'] .sparo-splash-window-control {
        color: rgba(71, 85, 105, 0.82);
      }

      .sparo-splash-window-control:hover {
        color: rgba(226, 232, 240, 0.96);
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.06);
      }

      html[data-theme-type='light'] .sparo-splash-window-control:hover {
        color: rgba(15, 23, 42, 0.9);
        background: rgba(15, 23, 42, 0.06);
        border-color: rgba(15, 23, 42, 0.04);
      }

      .sparo-splash-window-control--close:hover {
        color: #ef4444;
      }

      .sparo-splash-window-control:focus-visible {
        outline: 2px solid #60a5fa;
        outline-offset: 2px;
      }

      .sparo-splash-window-control svg {
        display: block;
        width: 10px;
        height: 10px;
      }

      .sparo-splash-brand {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        visibility: hidden;
      }

      #sparo-splash[data-motion-ready='1'] .sparo-splash-brand {
        visibility: visible;
      }

      .sparo-splash-delayed-loader {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(304px, 76vw);
        aspect-ratio: 1;
        overflow: visible;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.9);
      }

      #sparo-splash[data-delayed-loader='1'] .sparo-splash-delayed-loader {
        visibility: visible;
        animation: sparo-splash-delayed-loader-arrive 1.7s cubic-bezier(0.22, 0.68, 0.2, 1) both;
      }

      .sparo-splash-delayed-loader__track,
      .sparo-splash-delayed-loader__arc {
        fill: none;
        vector-effect: non-scaling-stroke;
        transform-origin: center;
      }

      .sparo-splash-delayed-loader__track {
        stroke: var(--ds-color-border-subtle, rgba(148, 163, 184, 0.28));
        stroke-width: 1.2;
        stroke-dasharray: 4.6 50.9;
        opacity: 0;
      }

      .sparo-splash-delayed-loader__orbit {
        transform-box: view-box;
        transform-origin: center;
      }

      .sparo-splash-delayed-loader__arc {
        stroke: var(--ds-color-brand-core, #e53935);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 2.7 663.3;
        opacity: 0;
      }

      #sparo-splash[data-delayed-loader='1'] .sparo-splash-delayed-loader__track {
        animation: sparo-splash-delayed-loader-assemble 1.7s ease-out both;
      }

      #sparo-splash[data-delayed-loader='1'] .sparo-splash-delayed-loader__orbit {
        animation: sparo-splash-delayed-loader-orbit 5.2s linear infinite;
      }

      #sparo-splash[data-delayed-loader='1'] .sparo-splash-delayed-loader__arc {
        animation:
          sparo-splash-delayed-loader-arc-arrive 1.7s ease-out both,
          sparo-splash-delayed-loader-arc-breathe 3.8s ease-in-out 1.7s infinite;
      }

      @keyframes sparo-splash-delayed-loader-arrive {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.9);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      @keyframes sparo-splash-delayed-loader-assemble {
        0% {
          opacity: 0;
          stroke-dasharray: 4.6 78.7;
        }
        42% {
          opacity: 0.72;
          stroke-dasharray: 4.6 50.9;
        }
        100% {
          opacity: 0.72;
          stroke-dasharray: 666 0;
        }
      }

      @keyframes sparo-splash-delayed-loader-arc-arrive {
        0% {
          opacity: 0;
          stroke-dasharray: 2.7 663.3;
        }
        38% {
          opacity: 1;
          stroke-dasharray: 5.3 660.7;
        }
        100% {
          opacity: 1;
          stroke-dasharray: 106.6 559.4;
        }
      }

      @keyframes sparo-splash-delayed-loader-arc-breathe {
        0%,
        100% {
          stroke-dasharray: 106.6 559.4;
          opacity: 0.82;
        }
        50% {
          stroke-dasharray: 133.2 532.8;
          opacity: 1;
        }
      }

      @keyframes sparo-splash-delayed-loader-orbit {
        to {
          transform: rotate(360deg);
        }
      }

      .sparo-splash-mark-slot {
        width: min(128px, 32vw);
        aspect-ratio: 1;
      }

      .sparo-splash-mark {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .sparo-splash-mark__surface,
      .sparo-splash-mark__focus {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        transform-origin: center;
        pointer-events: none;
        backface-visibility: hidden;
      }

      .sparo-splash-mark__focus {
        opacity: 0;
        clip-path: circle(21% at 50% 51%);
      }

      .sparo-splash-mark[data-motion='startup'] .sparo-splash-mark__surface {
        animation: sparo-splash-materialize 860ms cubic-bezier(0.22, 0.68, 0.2, 1) both;
        will-change: opacity, transform;
      }

      .sparo-splash-mark[data-motion='startup'] .sparo-splash-mark__focus {
        animation: sparo-splash-startup-core 860ms cubic-bezier(0.22, 0.68, 0.2, 1) both;
        will-change: opacity, transform;
      }

      .sparo-splash-mark[data-motion='thinking'] .sparo-splash-mark__surface {
        animation: sparo-splash-breathe 2.6s ease-in-out infinite;
        will-change: transform;
      }

      .sparo-splash-mark[data-motion='thinking'] .sparo-splash-mark__focus {
        animation: sparo-splash-focus 2.6s ease-in-out infinite;
        filter: saturate(1.08) brightness(1.025);
        will-change: opacity, transform;
      }

      @keyframes sparo-splash-materialize {
        0% {
          opacity: 0.12;
          transform: scale(0.86);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes sparo-splash-startup-core {
        0% {
          opacity: 0.92;
          transform: scale(0.94);
        }
        100% {
          opacity: 0;
          transform: scale(1.08);
        }
      }

      @keyframes sparo-splash-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.006);
        }
      }

      @keyframes sparo-splash-focus {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.44;
          transform: scale(1.025);
        }
      }

      .sparo-splash-wordmark {
        position: relative;
        width: min(220px, 55vw);
        aspect-ratio: 475 / 96;
      }

      .sparo-splash-wordmark img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        user-select: none;
        -webkit-user-drag: none;
      }

      .sparo-splash-wordmark--primary {
        visibility: hidden;
      }

      html[data-theme-type='light'] .sparo-splash-wordmark--primary {
        visibility: visible;
      }

      html[data-theme-type='light'] .sparo-splash-wordmark--reversed {
        visibility: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        .sparo-splash-window-control {
          transition: none;
        }

        .sparo-splash-mark__surface,
        .sparo-splash-mark__focus {
          animation: none !important;
          filter: none;
          opacity: 1;
          transform: none;
        }

        .sparo-splash-mark__focus {
          display: none;
        }

        #sparo-splash[data-delayed-loader='1'] .sparo-splash-delayed-loader,
        .sparo-splash-delayed-loader__track,
        .sparo-splash-delayed-loader__orbit,
        .sparo-splash-delayed-loader__arc {
          animation: none !important;
        }

        #sparo-splash[data-delayed-loader='1'] .sparo-splash-delayed-loader {
          opacity: 1;
          transform: translate(-50%, -50%);
        }

        .sparo-splash-delayed-loader__track {
          opacity: 0.72;
          stroke-dasharray: 666 0;
        }

        .sparo-splash-delayed-loader__arc {
          opacity: 1;
          stroke-dasharray: 106.6 559.4;
        }
      }
    </style>
    <script type="module">
      (async function () {
        var root = document.documentElement;
        if (root.dataset.sparoWindow === 'agent-companion') return;

        var isTauriDesktop = '__TAURI_INTERNALS__' in window || '__TAURI__' in window;
        var isMacOS =
          typeof navigator !== 'undefined' &&
          typeof navigator.platform === 'string' &&
          navigator.platform.toUpperCase().includes('MAC');
        if (!isTauriDesktop || isMacOS) return;

        root.dataset.sparoStaticWindowControls = '1';

        try {
          var tauriWindow = await import('@tauri-apps/api/window');
          var appWindow = tauriWindow.getCurrentWindow();
          var titlebar = document.getElementById('sparo-splash-titlebar');
          var minimizeButton = document.getElementById('sparo-splash-minimize');
          var maximizeButton = document.getElementById('sparo-splash-maximize');
          var closeButton = document.getElementById('sparo-splash-close');

          function stopEvent(event) {
            event.preventDefault();
            event.stopPropagation();
          }

          if (titlebar) {
            titlebar.addEventListener('mousedown', function (event) {
              if (event.button !== 0 || event.target.closest('button')) return;
              appWindow.startDragging().catch(function () {});
            });
            titlebar.addEventListener('dblclick', function (event) {
              if (event.target.closest('button')) return;
              toggleMaximize(event);
            });
          }

          if (minimizeButton) {
            minimizeButton.addEventListener('click', function (event) {
              stopEvent(event);
              appWindow.minimize().catch(function () {});
            });
          }

          async function toggleMaximize(event) {
            if (event) stopEvent(event);
            try {
              if (await appWindow.isMaximized()) {
                await appWindow.unmaximize();
              } else {
                await appWindow.maximize();
              }
            } catch (_) {}
          }

          if (maximizeButton) {
            maximizeButton.addEventListener('click', toggleMaximize);
          }

          if (closeButton) {
            closeButton.addEventListener('click', function (event) {
              stopEvent(event);
              appWindow.close().catch(function () {});
            });
          }
        } catch (_) {
          delete root.dataset.sparoStaticWindowControls;
        }
      })();
    </script>
  </head>

  <body>
    <div id="sparo-splash" role="status" aria-label="Loading Sparo OS">
      <div id="sparo-splash-titlebar" class="sparo-splash-titlebar" aria-hidden="false">
        <div class="sparo-splash-window-controls" role="toolbar" aria-label="Window controls">
          <button
            id="sparo-splash-minimize"
            class="sparo-splash-window-control sparo-splash-window-control--minimize"
            type="button"
            aria-label="Minimize"
          >
            <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <line x1="3" y1="7" x2="11" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
          <button
            id="sparo-splash-maximize"
            class="sparo-splash-window-control sparo-splash-window-control--maximize"
            type="button"
            aria-label="Maximize"
          >
            <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <rect x="2" y="2" width="8" height="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button
            id="sparo-splash-close"
            class="sparo-splash-window-control sparo-splash-window-control--close"
            type="button"
            aria-label="Close"
          >
            <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <line x1="3" y1="3" x2="11" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              <line x1="11" y1="3" x2="3" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>
      <div class="sparo-splash-brand" aria-hidden="true">
        <svg
          class="sparo-splash-delayed-loader"
          viewBox="0 0 240 240"
          aria-hidden="true"
          focusable="false"
        >
          <circle
            class="sparo-splash-delayed-loader__track"
            cx="120"
            cy="120"
            r="106"
            pathLength="100"
          />
          <g class="sparo-splash-delayed-loader__orbit">
            <circle
              class="sparo-splash-delayed-loader__arc"
              cx="120"
              cy="120"
              r="106"
              pathLength="100"
            />
          </g>
        </svg>
        <div class="sparo-splash-mark-slot">
          <div id="sparo-splash-motion-root" class="sparo-splash-mark" data-motion="idle">
            <img
              class="sparo-splash-mark__surface"
              src="/brand/sparo-mark-256.png"
              alt=""
              width="256"
              height="256"
              draggable="false"
            />
            <img
              class="sparo-splash-mark__focus"
              src="/brand/sparo-mark-256.png"
              alt=""
              width="256"
              height="256"
              draggable="false"
            />
          </div>
        </div>
        <div class="sparo-splash-wordmark">
          <img
            class="sparo-splash-wordmark--primary"
            src="/brand/sparo-wordmark-primary.png"
            alt=""
            width="475"
            height="96"
            draggable="false"
          />
          <img
            class="sparo-splash-wordmark--reversed"
            src="/brand/sparo-wordmark-reversed.png"
            alt=""
            width="475"
            height="96"
            draggable="false"
          />
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/boot/startupSplash.tsx"></script>
  </body>
</html>
